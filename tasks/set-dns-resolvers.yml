---
- name: Include task for set dns resolvers
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  with_first_found:
    - "set-dns-resolvers-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}.yml"
    - "set-dns-resolvers-{{ ansible_distribution | lower }}-{{ ansible_distribution_version }}.yml"
    - "set-dns-resolvers-{{ ansible_distribution | lower }}-{{ ansible_distribution_release }}.yml"
    - "set-dns-resolvers-{{ ansible_distribution | lower }}.yml"